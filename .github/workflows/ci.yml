name: CI

# Roda lint e testes em cada push e pull request.
on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv (+ Python 3.12)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (uv sync)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Run tests (pytest + cobertura ≥ 80%)
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80

      - name: dbt debug
        run: uv run dbt debug --project-dir transform --profiles-dir transform

      # Popula o DuckDB com as fixtures (janela de 1 dia coberta pela fixture de clima)
      # para que o dbt build rode sem a ingestão real pesada.
      - name: Seed DuckDB from fixtures
        env:
          DATA_INICIO: "2025-06-01"
          DATA_FIM: "2025-06-01"
        run: uv run python -m ingestion.seed_fixtures

      - name: dbt build (run + test)
        run: >
          uv run dbt build --project-dir transform --profiles-dir transform
          --vars '{"data_inicio": "2025-06-01", "data_fim": "2025-06-01"}'
