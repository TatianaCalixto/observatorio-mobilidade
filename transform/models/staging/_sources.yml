version: 2

sources:
  - name: raw
    description: >
      Tabelas RAW carregadas dos Parquet pela ingestão (ingestion.duckdb_load).
      No CI são populadas a partir das fixtures (ingestion.seed_fixtures).
    schema: main
    tables:
      - name: raw_gtfs_stops
      - name: raw_gtfs_routes
      - name: raw_gtfs_trips
      - name: raw_gtfs_stop_times
      - name: raw_gtfs_calendar
      - name: raw_gtfs_frequencies
      - name: raw_clima
      - name: raw_populacao
