version: 2

models:
  - name: stg_gtfs__stops
    description: "Paradas (pontos) da rede de transporte, tipadas a partir do GTFS."
    columns:
      - name: stop_id
        description: "Identificador único da parada."
        data_tests: [unique, not_null]
      - name: stop_name
        description: "Nome da parada."
      - name: stop_lat
        description: "Latitude (graus decimais)."
      - name: stop_lon
        description: "Longitude (graus decimais)."

  - name: stg_gtfs__routes
    description: "Linhas (rotas) da rede, tipadas a partir do GTFS."
    columns:
      - name: route_id
        description: "Identificador único da linha."
        data_tests: [unique, not_null]
      - name: route_short_name
        description: "Nome curto da linha (ex.: 8000-10)."
      - name: route_type
        description: "Tipo GTFS (3 = ônibus)."

  - name: stg_gtfs__trips
    description: "Viagens planejadas (instâncias de uma linha), tipadas a partir do GTFS."
    columns:
      - name: trip_id
        description: "Identificador único da viagem."
        data_tests: [unique, not_null]
      - name: route_id
        description: "Linha à qual a viagem pertence."
        data_tests: [not_null]
      - name: service_id
        description: "Calendário de serviço (dias de operação)."

  - name: stg_gtfs__stop_times
    description: "Horários planejados: cada parada de cada viagem (grão (trip_id, stop_sequence))."
    columns:
      - name: stop_time_id
        description: "Chave surrogate = trip_id-stop_sequence."
        data_tests: [unique, not_null]
      - name: trip_id
        description: "Viagem."
        data_tests: [not_null]
      - name: stop_id
        description: "Parada."
        data_tests: [not_null]
      - name: stop_sequence
        description: "Ordem da parada na viagem."
        data_tests: [not_null]

  - name: stg_clima
    description: "Clima horário por estação (INMET), tipado (grão (estacao, data, hora_utc))."
    columns:
      - name: clima_sk
        description: "Chave surrogate = estacao|data|hora_utc."
        data_tests: [unique, not_null]
      - name: data
        description: "Data da medição."
        data_tests: [not_null]
      - name: precipitacao_mm
        description: "Precipitação horária (mm)."
      - name: temperatura_c
        description: "Temperatura do ar (°C)."

  - name: stg_populacao
    description: "População por município (IBGE/SIDRA, Censo 2022), tipada."
    columns:
      - name: regiao_codigo
        description: "Código IBGE do município (chave de região)."
        data_tests: [unique, not_null]
      - name: populacao
        description: "População residente."

  - name: stg_gtfs__calendar
    description: "Calendário de serviços GTFS: flags por dia da semana e vigência."
    columns:
      - name: service_id
        description: "Identificador do serviço (ex.: USD, U__)."
        data_tests: [unique, not_null]
      - name: start_date
        description: "Início da vigência do serviço."
      - name: end_date
        description: "Fim da vigência do serviço."

  - name: stg_gtfs__frequencies
    description: "Frequências planejadas (headway) por viagem e janela de horário."
    columns:
      - name: frequency_id
        description: "Chave surrogate = trip_id-start_time."
        data_tests: [unique, not_null]
      - name: trip_id
        description: "Viagem (padrão) à qual a frequência se aplica."
        data_tests: [not_null]
      - name: headway_secs
        description: "Intervalo planejado entre partidas (segundos)."
        data_tests: [not_null]
